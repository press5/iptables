---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ansible-lint
        run: pip install ansible-core ansible-lint

      - name: Run ansible-lint
        run: ansible-lint .

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run pytest
        run: pytest tests/ -v

  molecule:
    name: Molecule / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    needs: [lint, unit-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: default
            name: "Debian 12, Ubuntu 22.04/24.04/26.04"
          - scenario: no_ipsets
            name: "Debian 12, Ubuntu 22.04/24.04/26.04 (no ipsets)"
          - scenario: rhel
            name: Rocky Linux 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Molecule
        run: pip install -r molecule-requirements.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install community.docker

      - name: Load netfilter kernel modules
        run: sudo modprobe ip6_tables ip_set ip_set_hash_ip xt_set

      - name: Run molecule
        run: molecule test -s ${{ matrix.scenario }}

  integration:
    name: Integration (Ubuntu Noble)
    runs-on: ubuntu-24.04
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ansible
        run: pip install ansible-core

      - name: Run role — first pass
        run: >-
          ansible-playbook
          -i 'localhost,'
          --become
          tests/integration/test.yml
          -v

      - name: Run role — idempotency check
        run: |
          ansible-playbook \
            -i 'localhost,' \
            --become \
            tests/integration/test.yml \
            | tee /tmp/idempotency.log
          grep -E '^localhost\s+.*changed=0' /tmp/idempotency.log

      - name: Verify IPv4 policy is DROP
        run: sudo iptables -L INPUT -n | grep -q 'policy DROP'

      - name: Verify IPv6 policy is DROP
        run: sudo ip6tables -L INPUT -n | grep -q 'policy DROP'

      - name: Verify ipset set exists
        run: sudo ipset list ci_blocklist

      - name: Verify ipset entry is present
        run: sudo ipset test ci_blocklist 198.51.100.1
