---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: rockylinux9
    image: geerlingguy/docker-rockylinux9-ansible
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /usr/lib/systemd/systemd
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  inventory:
    group_vars:
      all:
        ansible_python_interpreter: /usr/bin/python3
        # RHEL 9's sudo PAM stack includes pam_systemd.so, which fails in
        # containers because systemd-logind can't register a session. su uses
        # a different PAM stack (/etc/pam.d/su) that doesn't have this problem.
        ansible_become_method: su
verifier:
  name: ansible
